<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/base :: head('Acción')"></head>

<body>

    <div class="d-flex">

        <div th:replace="layout/base :: menu"></div>

        <div class="content-wrapper p-4 w-100">

            <h2 class="mb-3 text-center" th:text="${accion.codigoAccion == null ? 'Agregar Acción' : 'Editar Acción'}">
            </h2>

            <div class="container mt-4">
                <div class="card shadow mb-4">
                    <div class="card-body">

                        <form id="accionForm" th:action="@{/accion/guardar}" th:object="${accion}" method="post">

                            <input type="hidden" th:field="*{codigoAccion}" />

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label>Aspecto Ambiental</label>
                                    <textarea th:field="*{aspectoAmbientalAccion}" class="form-control"
                                        rows="3"></textarea>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Impacto Ambiental</label>
                                    <textarea th:field="*{impactoAmbientalAccion}" class="form-control"
                                        rows="3"></textarea>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Medidas Propuestas</label>
                                    <textarea th:field="*{medidasPropuestasAccion}" class="form-control"
                                        rows="3"></textarea>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Indicador</label>
                                    <input type="text" th:field="*{indicadorPlaceholderAccion}" class="form-control">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Numerador</label>
                                    <input type="number" th:field="*{numeradorValorAccion}" class="form-control">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Denominador</label>
                                    <input type="number" th:field="*{denominadorValorAccion}" class="form-control">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Frecuencia</label>
                                    <input type="number" th:field="*{frecuenciaAccion}" class="form-control">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Periodo</label>
                                    <input type="text" th:field="*{periodoAccion}" class="form-control">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Estado</label>
                                    <select th:field="*{estadoAplica}" class="form-select">
                                        <option value="">Seleccione</option>
                                        <option value="1">Activo</option>
                                        <option value="0">Inactivo</option>
                                    </select>
                                </div>

                            </div>

                            <div class="text-end">
                                <a th:href="@{/accion}" class="btn btn-outline-danger me-2">
                                    <i class="fa-solid fa-left-long"></i> Volver
                                </a>

                                <button type="submit" class="btn btn-outline-success">
                                    Guardar <i class="fa-regular fa-floppy-disk"></i>
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <div th:replace="layout/base :: footer"></div>

        </div>

    </div>

    <style>
        label.error {
            color: #dc3545;
            font-size: 0.82rem;
            font-weight: 500;
            margin-top: 5px;
            display: block;
        }
    
        /* Bordes de validación */
        .form-control.error,
        .form-select.error,
        textarea.error {
            border-color: #dc3545 !important;
        }
    
        .form-control.valid,
        .form-select.valid,
        textarea.valid {
            border-color: #198754 !important;
        }
    
        /* Estilo para los textareas */
        textarea.form-control {
            resize: none;
            /* Evita que el usuario deforme el diseño */
        }
    
        .card {
            border-radius: 12px;
            border: none;
        }
    </style>
    
    <script>
        $(function () {
            $("#accionForm").validate({
                rules: {
                    aspectoAmbientalAccion: { required: true },
                    impactoAmbientalAccion: { required: true },
                    medidasPropuestasAccion: { required: true },
                    indicadorPlaceholderAccion: { required: true },
                    numeradorValorAccion: {
                        required: true,
                        number: true,
                        min: 0
                    },
                    denominadorValorAccion: {
                        required: true,
                        number: true,
                        min: 1
                    },
                    frecuenciaAccion: {
                        required: true,
                        digits: true,
                        min: 1
                    },
                    periodoAccion: { required: true },
                    estadoAplica: { required: true }
                },
                messages: {
                    aspectoAmbientalAccion: { required: "El aspecto ambiental es requerido." },
                    impactoAmbientalAccion: { required: "El impacto ambiental es requerido." },
                    medidasPropuestasAccion: { required: "Las medidas propuestas son requeridas." },
                    indicadorPlaceholderAccion: { required: "El nombre del indicador es requerido." },
                    numeradorValorAccion: {
                        required: "El numerador es requerido.",
                        number: "Ingrese un valor numérico.",
                        min: "El valor no puede ser negativo."
                    },
                    denominadorValorAccion: {
                        required: "El denominador es requerido.",
                        number: "Ingrese un valor numérico.",
                        min: "El denominador debe ser al menos 1."
                    },
                    frecuenciaAccion: {
                        required: "La frecuencia es requerida.",
                        digits: "Solo se permiten números enteros.",
                        min: "La frecuencia mínima es 1."
                    },
                    periodoAccion: { required: "El periodo es requerido (ej: Mensual, Anual)." },
                    estadoAplica: { required: "Debe seleccionar un estado." }
                },
                errorClass: "error",
                validClass: "valid",
                errorElement: "label",

                // Resaltado visual para que se vea pro con Bootstrap
                highlight: function (element) {
                    $(element).addClass('is-invalid').removeClass('is-valid');
                },
                unhighlight: function (element) {
                    $(element).addClass('is-valid').removeClass('is-invalid');
                },

                submitHandler: function (form) {
                    // Bloqueamos el botón para evitar doble envío
                    $('button[type="submit"]').html('<span class="spinner-border spinner-border-sm"></span> Guardando...');
                    $('button[type="submit"]').prop('disabled', true);
                    form.submit();
                }
            });
        });
    </script>

</body>

</html>
