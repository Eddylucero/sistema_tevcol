<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/base :: head('Gestión de Acciones')"></head>

<body>

    <div th:replace="layout/base :: nav-mobile"></div>

    <div class="d-flex" id="wrapper">

        <div th:replace="layout/base :: menu"></div>

        <div class="content-wrapper p-3 p-md-4 w-100">

            <div th:if="${success}">
                <script th:inline="javascript">
                    Swal.fire({
                        icon: 'success',
                        title: '¡Hecho!',
                        text: [[${ success }]],
                        confirmButtonColor: '#198754'
                    });
                </script>
            </div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-secondary mb-3 mb-md-0">
                    <i class="fa-solid fa-list-check me-2"></i>Listado de Acciones
                </h2>
                <a th:href="@{/accion/nuevo}" class="btn btn-primary shadow-sm">
                    <i class="fa-solid fa-plus me-1"></i> Nueva Acción
                </a>
            </div>

            <div class="card shadow border-0">
                <div class="card-body p-2 p-md-3">
                    <div class="table-responsive">
                        <table id="tablaAcciones" class="table table-hover align-middle w-100">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Aspecto Ambiental</th>
                                    <th>Impacto Ambiental</th>
                                    <th>Estado</th>
                                    <th>Frecuencia</th>
                                    <th>Periodo</th>
                                    <th class="text-center">Opciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${acciones}">
                                    <td th:text="${a.codigoAccion}" class="fw-bold"></td>
                                    <td th:text="${a.aspectoAmbientalAccion}"></td>
                                    <td th:text="${a.impactoAmbientalAccion}"></td>
                                    <td>
                                        <span th:if="${a.estadoAplica == 1}" class="badge rounded-pill bg-success">
                                            <i class="fa-solid fa-check me-1"></i> Activo
                                        </span>
                                        <span th:if="${a.estadoAplica == 0}" class="badge rounded-pill bg-danger">
                                            <i class="fa-solid fa-xmark me-1"></i> Inactivo
                                        </span>
                                    </td>
                                    <td th:text="${a.frecuenciaAccion}"></td>
                                    <td th:text="${a.periodoAccion}"></td>
                                    <td>
                                        <div class="d-flex justify-content-center gap-2">
                                            <a th:href="@{/accion/editar/{id}(id=${a.codigoAccion})}"
                                                class="btn btn-sm btn-outline-warning" title="Editar">
                                                <i class="fa-solid fa-pen"></i>
                                            </a>
                                            <button class="btn btn-sm btn-outline-danger"
                                                th:onclick="|eliminarAccion(${a.codigoAccion})|" title="Eliminar">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="layout/base :: footer"></div>

        </div>
    </div>

    <div th:replace="layout/base :: scripts-base"></div>

    <script th:inline="javascript">
        // Corrección de URL de eliminación
        const eliminarAccionUrl = [[@{/accion/eliminar/}]];

        function eliminarAccion(id) {
            Swal.fire({
                title: '¿Eliminar acción?',
                text: 'Se eliminará la acción con ID ' + id + '. Esta operación es irreversible.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = eliminarAccionUrl + id;
                }
            });
        }

        $(document).ready(function () {
            $('#tablaAcciones').DataTable({
                responsive: true,
                autoWidth: false,
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.8/i18n/es-ES.json'
                },
                columnDefs: [
                    { responsivePriority: 1, targets: 1 }, // Aspecto visible siempre
                    { responsivePriority: 2, targets: -1 } // Opciones visibles siempre
                ]
            });
        });
    </script>

</body>

</html>
