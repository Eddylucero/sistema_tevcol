<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/base :: head('Nueva Clave')"></head>

<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 shadow">
                <h4 class="text-center">Nueva Contraseña</h4>
                <form th:action="@{/auth/restablecer}" method="post">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="mb-3">
                        <label>Nueva contraseña:</label>
                        <input type="password" name="password" class="form-control" id="pass" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Cambiar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
