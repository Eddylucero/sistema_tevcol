<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Login')}"></head>

<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4 text-success"><i class="fa-solid fa-leaf"></i> TEVCOL</h3>

                        <form th:action="@{/auth/login}" method="post" id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" name="username" id="username" class="form-control"
                                    placeholder="ejemplo@correo.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" name="password" id="password" class="form-control"
                                    placeholder="******">
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-3 fw-bold">Entrar</button>
                            <div class="text-center">
                                <a th:href="@{/auth/olvido}" class="text-decoration-none small text-muted">¿Olvidaste tu
                                    contraseña?</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(document).ready(function () {
            // 1. VALIDACIÓN CON JQUERY VALIDATE
            $("#loginForm").validate({
                rules: {
                    username: { required: true, email: true },
                    password: { required: true }
                },
                messages: {
                    username: {
                        required: "El correo es obligatorio",
                        email: "Ingrese un formato de correo válido"
                    },
                    password: {
                        required: "La contraseña es obligatoria"
                    }
                },
                errorElement: 'span',
                errorClass: 'text-danger small'
            });

            // 2. CONFIGURACIÓN DE TOASTS CON SWEETALERT2
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });

            const urlParams = new URLSearchParams(window.location.search);

            if (urlParams.has('errorEmail')) {
                Toast.fire({ icon: 'error', title: 'Correo incorrecto', text: 'El usuario no existe en el sistema.' });
            }
            if (urlParams.has('errorPass')) {
                Toast.fire({ icon: 'warning', title: 'Contraseña incorrecta', text: 'La clave ingresada no es válida.' });
            }
            if (urlParams.has('logout')) {
                Toast.fire({ icon: 'info', title: 'Sesión cerrada' });
            }
            if (urlParams.has('resetSuccess')) {
                Toast.fire({ icon: 'success', title: '¡Clave actualizada!' });
            }
        });
    </script>
</body>

</html>
