<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Login')}"></head>

<style>
    :root {
        --brand-green: #4db69e;
        --dark-text: #333;
    }

    body {
        background-color: #92d9c8;
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Overlay de Carga - MISMA ANIMACIÓN QUE RECUPERAR */
    #loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .spinner {
        width: 56px;
        height: 56px;
        display: grid;
        border: 4px solid #0000;
        border-radius: 50%;
        border-right-color: var(--brand-green);
        animation: spinner-d3o04m 1s infinite linear;
    }

    .spinner::before,
    .spinner::after {
        content: "";
        grid-area: 1/1;
        margin: 2px;
        border: inherit;
        border-radius: 50%;
        animation: spinner-d3o04m 2s infinite;
    }

    .spinner::after {
        margin: 8px;
        animation-duration: 3s;
    }

    @keyframes spinner-d3o04m {
        100% {
            transform: rotate(1turn);
        }
    }

    .loader-text {
        margin-top: 15px;
        color: var(--dark-text);
        font-weight: 600;
        letter-spacing: 1px;
    }

    /* Estructura Card */
    .login-container {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        max-width: 900px;
        width: 100%;
        display: flex;
        min-height: 500px;
    }

    .login-form-side {
        flex: 1;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-welcome-side {
        flex: 1;
        background-color: var(--brand-green);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
        position: relative;
        clip-path: ellipse(100% 100% at 100% 50%);
    }

    .form-control {
        background-color: #eeeeee !important;
        border: none !important;
        padding: 12px 15px;
        border-radius: 5px !important;
    }

    span.text-danger.small {
        display: block;
        width: 100%;
        margin-top: 5px;
        margin-left: 45px;
    }

    .input-group-text {
        cursor: pointer;
    }

    .btn-brand {
        background-color: var(--brand-green);
        color: white;
        border: none;
        padding: 12px 45px;
        border-radius: 8px;
        font-weight: bold;
        text-transform: uppercase;
        transition: 0.3s;
    }

    .btn-brand:hover {
        background-color: #3e9a85;
        color: white;
        transform: scale(1.05);
    }

    @media (max-width: 768px) {
        .login-welcome-side {
            display: none;
        }

        .login-container {
            max-width: 400px;
        }
    }
</style>

<body>

    <div id="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">VERIFICANDO CREDENCIALES...</div>
    </div>

    <div class="login-container mx-3">
        <div class="login-form-side">
            <h2 class="fw-bold mb-3 text-center">Iniciar Sesión</h2>
            <p class="text-muted small text-center mb-4">Use su correo y contraseña</p>

            <form th:action="@{/auth/login}" method="post" id="loginForm">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-muted">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="username" id="username" class="form-control" placeholder="Email">
                    </div>
                </div>

                <div class="mb-2">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-muted">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" id="password" class="form-control"
                            placeholder="Password">
                        <span class="input-group-text bg-transparent border-0 text-muted" id="togglePassword">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                </div>

                <div class="text-center mb-4">
                    <a th:href="@{/auth/olvido}" class="text-decoration-underline small text-muted">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <div class="text-center">
                    <button type="submit" id="btnSubmit" class="btn btn-brand shadow-sm w-100">INICIAR SESIÓN</button>
                </div>
            </form>
        </div>

        <div class="login-welcome-side">
            <h1 class="fw-bold mb-3">¡Bienvenido!</h1>
            <p class="mb-4">Ingrese sus datos personales para usar todas las funciones del sitio</p>
            <div class="text-center mt-4">
                <i class="fa-solid fa-leaf fa-3x mb-3"></i>
                <p class="fw-bold">TEVCOL</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(document).ready(function () {

            // 1. Ver/Ocultar contraseña
            $('#togglePassword').on('click', function () {
                const passwordField = $('#password');
                const eyeIcon = $('#eyeIcon');
                const type = passwordField.attr('type') === 'password' ? 'text' : 'password';
                passwordField.attr('type', type);
                eyeIcon.toggleClass('fa-eye fa-eye-slash');
            });

            // 2. Validación JQuery con animación al éxito
            $("#loginForm").validate({
                rules: {
                    username: { required: true, email: true },
                    password: { required: true }
                },
                messages: {
                    username: {
                        required: "El correo es obligatorio",
                        email: "Ingrese un formato de correo válido"
                    },
                    password: {
                        required: "La contraseña es obligatoria"
                    }
                },
                errorElement: 'span',
                errorClass: 'text-danger small',
                errorPlacement: function (error, element) {
                    error.insertAfter(element.closest('.input-group'));
                },
                // AQUÍ SE ACTIVA EL LOADER AL ENVIAR
                submitHandler: function (form) {
                    $("#loader-overlay").css("display", "flex");
                    $("#btnSubmit").prop("disabled", true);
                    form.submit();
                }
            });

            // 3. Toasts
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 4000,
                timerProgressBar: true
            });

            const urlParams = new URLSearchParams(window.location.search);

            if (urlParams.has('tokenExpirado')) {
                Toast.fire({ icon: 'error', title: 'Enlace expirado', text: 'El enlace de recuperación solo es válido por 5 minutos.' });
            }
            if (urlParams.has('errorEmail')) {
                Toast.fire({ icon: 'error', title: 'Correo incorrecto', text: 'El usuario no existe.' });
            }
            if (urlParams.has('errorPass')) {
                Toast.fire({ icon: 'warning', title: 'Contraseña incorrecta', text: 'La clave no es válida.' });
            }
            if (urlParams.has('logout')) {
                Toast.fire({ icon: 'info', title: 'Sesión cerrada' });
            }
            if (urlParams.has('resetSuccess')) {
                Toast.fire({ icon: 'success', title: 'Clave actualizada', text: 'Ya puedes iniciar sesión con tu nueva contraseña.' });
            }
        });
    </script>
</body>

</html>
