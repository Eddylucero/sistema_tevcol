<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Recuperar Acceso')}"></head>

<style>
    :root {
        --brand-green: #4db69e;
        --dark-text: #333;
    }

    body {
        background-color: #92d9c8;
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Overlay de Carga */
    #loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
        display: none;
        /* Oculto por defecto */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    /* Spinner Moderno */
    .spinner {
        width: 56px;
        height: 56px;
        display: grid;
        border: 4px solid #0000;
        border-radius: 50%;
        border-right-color: var(--brand-green);
        animation: spinner-d3o04m 1s infinite linear;
    }

    .spinner::before,
    .spinner::after {
        content: "";
        grid-area: 1/1;
        margin: 2px;
        border: inherit;
        border-radius: 50%;
        animation: spinner-d3o04m 2s infinite;
    }

    .spinner::after {
        margin: 8px;
        animation-duration: 3s;
    }

    @keyframes spinner-d3o04m {
        100% {
            transform: rotate(1surn);
        }
    }

    .loader-text {
        margin-top: 15px;
        color: var(--dark-text);
        font-weight: 600;
        letter-spacing: 1px;
    }

    /* Estructura Card */
    .login-container {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        max-width: 900px;
        width: 100%;
        display: flex;
        min-height: 500px;
    }

    .login-form-side {
        flex: 1;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-welcome-side {
        flex: 1;
        background-color: var(--brand-green);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
        position: relative;
        clip-path: ellipse(100% 100% at 100% 50%);
    }

    .form-control {
        background-color: #eeeeee !important;
        border: none !important;
        padding: 12px 15px;
        margin: 8px 0;
        border-radius: 5px;
    }

    .btn-brand {
        background-color: var(--brand-green);
        color: white;
        border: none;
        padding: 12px 45px;
        border-radius: 8px;
        font-weight: bold;
        text-transform: uppercase;
        transition: 0.3s;
    }

    .btn-brand:hover {
        background-color: #3e9a85;
        color: white;
        transform: scale(1.05);
    }

    @media (max-width: 768px) {
        .login-welcome-side {
            display: none;
        }

        .login-container {
            max-width: 400px;
        }
    }
</style>

<body>

    <div id="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">ENVIANDO ENLACE...</div>
    </div>

    <div class="login-container mx-3">
        <div class="login-form-side">
            <h2 class="fw-bold mb-3 text-center">Recuperar Acceso</h2>
            <p class="text-muted small text-center mb-4">Ingresa tu correo para recibir las instrucciones de
                restablecimiento.</p>

            <form th:action="@{/auth/olvido}" method="post" id="olvidoForm">
                <div class="mb-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-muted">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="email" id="email" class="form-control"
                            placeholder="Tu correo electrónico">
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" id="btnSubmit" class="btn btn-brand shadow-sm w-100 mb-3">ENVIAR
                        ENLACE</button>
                    <a th:href="@{/auth/login}" class="text-decoration-underline small text-muted d-block mt-2">
                        Volver al inicio de sesión
                    </a>
                </div>
            </form>
        </div>

        <div class="login-welcome-side">
            <h1 class="fw-bold mb-3">¿Problemas?</h1>
            <p class="mb-4">No te preocupes, te ayudaremos a recuperar tu acceso en un momento.</p>
            <div class="text-center mt-4">
                <i class="fa-solid fa-key fa-3x mb-3"></i>
                <p class="fw-bold">SEGURIDAD TEVCOL</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(document).ready(function () {
            $("#olvidoForm").validate({
                rules: {
                    email: { required: true, email: true }
                },
                messages: {
                    email: {
                        required: "Por favor, ingresa tu correo",
                        email: "Formato de correo no válido"
                    }
                },
                errorElement: 'span',
                errorClass: 'text-danger small mt-1 d-block',
                submitHandler: function (form) {
                    // Mostrar el overlay de carga con efecto Flex
                    $("#loader-overlay").css("display", "flex");
                    // Desactivar el botón para evitar múltiples clics
                    $("#btnSubmit").prop("disabled", true);
                    form.submit();
                }
            });

            // Toasts de respuesta (seguimos usando Swal para los mensajes finales)
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 4000,
                timerProgressBar: true
            });

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('success')) {
                Toast.fire({ icon: 'success', title: 'Correo enviado correctamente' });
            }
            if (urlParams.has('errorEmail')) {
                Toast.fire({ icon: 'error', title: 'Correo no encontrado', text: 'El email no existe en nuestra base.' });
            }
        });
    </script>
</body>

</html>
