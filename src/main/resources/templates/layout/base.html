<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Sistema TEVCOL</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
        }

        .sidebar .nav-link {
            color: #ffffff;
            padding: 12px 20px;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .content-wrapper {
            flex-grow: 1;
        }
    </style>
</head>

<body class="bg-light">

    <div class="d-flex">

        <nav th:fragment="menu" class="sidebar bg-success text-white p-3">
            <h4 class="text-center fw-bold mb-4">
                <i class="fa-solid fa-leaf"></i> TEVCOL
            </h4>

            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/}">
                        <i class="fa-solid fa-home me-2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a class="nav-link text-white" th:href="@{/accion}">
                        <i class="fa-solid fa-list-check me-2"></i> Acciones
                    </a>
                </li>
                <li>
                    <a class="nav-link text-white" th:href="@{/actividad}">
                        <i class="fa-solid fa-tasks me-2"></i> Actividades
                    </a>
                </li>
            </ul>

            <hr class="text-white">

            <div th:if="${#authorization.expression('isAuthenticated()')}">
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user-circle me-2"></i>
                        <strong th:text="${#authentication.name}">Usuario</strong>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="fa-solid fa-sign-out-alt me-2"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="content-wrapper p-4 w-100">
            <div th:replace="${contenido}"></div>

            <footer th:fragment="footer" class="bg-white py-3 mt-5 border-top shadow-sm">
                <div class="container text-center">
                    <h6 class="mb-0"><b>Desarrollado por:</b> Eddy Lucero</h6>
                    <small>UTC - 2026 | Sistema de Gestión Ambiental</small>
                </div>
            </footer>
        </div>

    </div>

    <script th:inline="javascript">
        $(document).ready(function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('loginSuccess')) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Bienvenido al Sistema!',
                    text: 'Sesión iniciada correctamente como Administrador',
                    confirmButtonColor: '#198754',
                    timer: 3000,
                    timerProgressBar: true
                });
                const cleanUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }
        });
    </script>

</body>

</html>
