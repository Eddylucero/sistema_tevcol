<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/base :: head('Gestión de Actividades')"></head>

<body>

    <div th:replace="layout/base :: nav-mobile"></div>

    <div class="d-flex" id="wrapper">

        <div th:replace="layout/base :: menu"></div>

        <div class="content-wrapper p-3 p-md-4 w-100">

            <div th:if="${success}">
                <script th:inline="javascript">
                    Swal.fire({
                        icon: 'success',
                        title: '¡Operación Exitosa!',
                        text: [[${ success }]],
                        confirmButtonColor: '#198754'
                    });
                </script>
            </div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-secondary mb-3 mb-md-0">
                    <i class="fa-solid fa-tasks me-2"></i>Listado de Actividades
                </h2>
                <a th:href="@{/actividad/nuevo}" class="btn btn-primary shadow-sm">
                    <i class="fa-solid fa-plus me-1"></i> Nueva Actividad
                </a>
            </div>

            <div class="card shadow border-0">
                <div class="card-body p-2 p-md-3">
                    <div class="table-responsive">
                        <table id="tablaActividades" class="table table-hover align-middle w-100">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>N° Actividad</th>
                                    <th>Inicio</th>
                                    <th>Máximo</th>
                                    <th>Estado</th>
                                    <th>Acción Asociada</th>
                                    <th class="text-center">Opciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${actividades}">
                                    <td th:text="${a.codigoActividad}" class="fw-bold"></td>
                                    <td th:text="${a.numeroActividad}"></td>
                                    <td th:text="${a.fechaIniActividad}"></td>
                                    <td th:text="${a.fechaMaxActividad}"></td>
                                    <td>
                                        <span class="badge rounded-pill bg-info text-dark"
                                            th:text="${a.estadoActividad}">Pendiente</span>
                                    </td>
                                    <td th:text="${a.accion.codigoAccion}"></td>
                                    <td>
                                        <div class="d-flex justify-content-center gap-2">
                                            <a th:href="@{/actividad/editar/{id}(id=${a.codigoActividad})}"
                                                class="btn btn-sm btn-outline-warning" title="Editar">
                                                <i class="fa-solid fa-pen"></i>
                                            </a>
                                            <button class="btn btn-sm btn-outline-danger"
                                                th:onclick="|eliminarActividad(${a.codigoActividad})|" title="Eliminar">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="layout/base :: footer"></div>

        </div>
    </div>

    <div th:replace="layout/base :: scripts-base"></div>

    <script th:inline="javascript">
        // Corrección de la URL (eliminando espacios)
        const eliminarActividadUrl = [[@{/actividad/eliminar/}]];

        function eliminarActividad(id) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: "La actividad con ID " + id + " será eliminada permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = eliminarActividadUrl + id;
                }
            });
        }

        $(document).ready(function () {
            $('#tablaActividades').DataTable({
                responsive: true,
                autoWidth: false,
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.8/i18n/es-ES.json'
                },
                columnDefs: [
                    { responsivePriority: 1, targets: 1 }, // N° Actividad siempre visible
                    { responsivePriority: 2, targets: -1 } // Opciones siempre visible
                ]
            });
        });
    </script>

</body>

</html>
