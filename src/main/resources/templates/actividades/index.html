<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/base :: head('Actividades')"></head>

<body>
    <div th:fragment="contenido">
        <!-- Mensajes de éxito -->
        <div th:if="${success}">
            <script th:inline="javascript">
                Swal.fire({
                    icon: 'success',
                    title: 'Éxito',
                    text: [[${ success }]],
                    confirmButtonColor: '#198754'
                });
            </script>
        </div>

        <!-- Mensajes de error -->
        <div th:if="${error}">
            <script th:inline="javascript">
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: [[${ error }]],
                    confirmButtonColor: '#dc3545'
                });
            </script>
        </div>

        <!-- Cabecera con título y botón nuevo -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">
                <i class="fa-solid fa-tasks me-2 text-success"></i>
                Listado de Actividades
            </h2>
            <a th:href="@{/actividad/nuevo}" class="btn btn-success">
                <i class="fa-solid fa-plus me-2"></i>Nueva Actividad
            </a>
        </div>

        <!-- Tabla de actividades -->
        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table id="tablaActividades" class="table table-bordered table-hover text-center align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>Código Actividad</th>
                                <th>N° Actividad</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Máxima</th>
                                <th>Estado</th>
                                <th>Acción</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${actividades}" th:unless="${#lists.isEmpty(actividades)}">
                                <td th:text="${a.codigoActividad}">1</td>
                                <td th:text="${a.numeroActividad}">1</td>
                                <td th:text="${#dates.format(a.fechaIniActividad, 'dd/MM/yyyy')}">01/01/2024</td>
                                <td th:text="${#dates.format(a.fechaMaxActividad, 'dd/MM/yyyy')}">31/12/2024</td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${a.estadoActividad == 'ACTIVO' ? 'bg-success' : 
                                                                         a.estadoActividad == 'INACTIVO' ? 'bg-secondary' : 'bg-warning'}"
                                        th:text="${a.estadoActividad}">ACTIVO</span>
                                </td>
                                <td th:text="${a.accion != null ? a.accion.codigoAccion : 'N/A'}">ACC-001</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/actividad/editar/{id}(id=${a.codigoActividad})}"
                                            class="btn btn-outline-warning btn-sm" title="Editar">
                                            <i class="fa-solid fa-pen"></i>
                                        </a>
                                        <button class="btn btn-outline-danger btn-sm"
                                            th:onclick="'eliminarActividad(' + ${a.codigoActividad} + ')'"
                                            title="Eliminar">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(actividades)}">
                                <td colspan="7" class="text-center text-muted py-5">
                                    <i class="fa-solid fa-folder-open fa-3x mb-3"></i><br>
                                    No hay actividades registradas
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const eliminarActividadUrl = [[@{/actividad/eliminar/}]];

        function eliminarActividad(id) {
            Swal.fire({
                title: '¿Eliminar actividad?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = eliminarActividadUrl + id;
                }
            });
        }

        $(document).ready(function () {
            try {
                $('#tablaActividades').DataTable({
                    language: {
                        url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/es-ES.json'
                    },
                    pageLength: 10,
                    order: [[0, 'desc']],
                    columnDefs: [
                        { orderable: false, targets: [6] }
                    ],
                    responsive: true,
                    autoWidth: false,
                    lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "Todos"]]
                });
            } catch (e) {
                console.error('Error al inicializar DataTable:', e);
            }
        });
        /*]]>*/
    </script>
</body>

</html>
