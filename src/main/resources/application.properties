spring.application.name=sistema_tevcol

# ✅ CORREGIDO: usa 'mysql' en lugar de ${MYSQLHOST} para comunicación interna
spring.datasource.url=jdbc:mysql://mysql:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ Especifica el dialecto explícitamente (para evitar el error de detección)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}

