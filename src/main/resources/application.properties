spring.application.name=sistema_tevcol

# Base URL para enlaces de recuperación
app.base-url=${BASE_URL:http://localhost:8080}

# 🚨 CONEXIÓN PÚBLICA (Mantenemos lo que ya te funcionó)
spring.datasource.url=jdbc:mysql://interchange.proxy.rlwy.net:17949/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ Configuración JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# 📧 CONFIGURACIÓN BREVO - Puerto SSL
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtps

# Propiedades específicas para SSL
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.ssl.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtps.connectiontimeout=10000
spring.mail.properties.mail.smtps.timeout=10000