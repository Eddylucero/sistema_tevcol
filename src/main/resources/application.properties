spring.application.name=sistema_tevcol

# Base URL para enlaces de recuperación
app.base-url=${BASE_URL:http://localhost:8080}

# 🚨 CONEXIÓN PÚBLICA - Para probar si el problema es de red privada
spring.datasource.url=jdbc:mysql://interchange.proxy.rlwy.net:17949/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ Configuración JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# 📧 EMAIL CONFIGURATION - Usando variables de entorno
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true