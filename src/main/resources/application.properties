spring.application.name=sistema_tevcol

# Base URL para enlaces de recuperación
app.base-url=${BASE_URL:http://localhost:8080}

# 🚨 CONEXIÓN PÚBLICA (Mantenemos lo que ya te funcionó)
spring.datasource.url=jdbc:mysql://interchange.proxy.rlwy.net:17949/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ Configuración JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# 📧 EMAIL CONFIGURATION - Versión robusta para Railway
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Propiedades específicas de JavaMail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Tiempos de espera para evitar que se quede colgado (Connection Timed Out)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Forzar protocolos seguros
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com